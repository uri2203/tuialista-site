<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo de agentes — TuIAlista</title>
<meta name="description" content="Elige tus agentes de IA local. Licencia mensual, 7 días de prueba, cancela cuando quieras.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.30.0/dist/tabler-icons.min.css">
<style>
  :root{--steel-900:#0f1922;--paper:#f5f6f4;--paper-2:#eceee9;--ink:#0f1922;--muted:#5a6b73;--signal:#e8821e;--signal-dim:#c46a12;--line:#d4d8d2;--ok:#1d9e75}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',system-ui,sans-serif;background:var(--paper-2);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  header{position:sticky;top:0;background:rgba(245,246,244,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:10}
  .nav{max-width:1080px;margin:0 auto;padding:0 24px;height:62px;display:flex;align-items:center;justify-content:space-between}
  .logo{font-family:'Space Grotesk';font-weight:700;font-size:19px;text-decoration:none;color:var(--ink);display:flex;align-items:center;gap:8px}
  .logo .dot{width:8px;height:8px;border-radius:50%;background:var(--signal)}
  .logo b{color:var(--signal)}
  .nav .r{display:flex;align-items:center;gap:18px}
  .nav .r a{font-size:14px;color:var(--muted);text-decoration:none}
  .nav .r a:hover{color:var(--ink)}
  main{max-width:1080px;margin:0 auto;padding:38px 24px 80px}
  .head{margin-bottom:26px}
  .eyebrow{font-family:'JetBrains Mono';font-size:11.5px;letter-spacing:.1em;color:var(--signal-dim);margin-bottom:8px}
  h1{font-family:'Space Grotesk';font-size:clamp(26px,4vw,34px);line-height:1.12;margin-bottom:8px}
  .sub{color:var(--muted);font-size:15px;max-width:640px}
  .trust{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px;font-size:13px;color:var(--muted)}
  .trust span{display:flex;align-items:center;gap:6px}
  .trust .ti{color:var(--ok)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:26px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column}
  .ico{width:42px;height:42px;border-radius:11px;background:var(--paper-2);display:flex;align-items:center;justify-content:center;font-size:21px;color:var(--signal-dim);margin-bottom:13px}
  .card h3{font-family:'Space Grotesk';font-size:17px;font-weight:600;margin-bottom:7px}
  .card p{font-size:13.5px;color:var(--muted);line-height:1.55;flex:1;margin-bottom:14px}
  .price{font-family:'Space Grotesk';font-size:22px;font-weight:500;margin-bottom:14px}
  .price small{font-size:13px;color:var(--muted);font-weight:400}
  .buy{width:100%;padding:11px;border:none;border-radius:9px;background:var(--steel-900);color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:500;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;transition:.15s}
  .buy:hover{background:var(--signal);color:#1a1206}
  .state{grid-column:1/-1;text-align:center;color:var(--muted);padding:50px 0;font-size:15px}
  footer{background:var(--steel-900);color:#aeb8bd;text-align:center;padding:24px;font-size:13px}
  footer a{color:#cdd5d9;text-decoration:none}
  @media(max-width:520px){.nav .r a.hide-sm{display:none}}
</style>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Product",
  "name": "Cat\u00e1logo de agentes \u2014 TuIAlista",
  "description": "Elige tus agentes de IA local. Licencia mensual, 7 d\u00edas de prueba, cancela cuando quieras.",
  "url": "https://tuialista.com/catalogo/",
  "brand": {
    "@type": "Brand",
    "name": "Tuialista"
  }
}
</script>
<meta property="og:title" content="Catálogo de agentes — TuIAlista">
<meta property="og:description" content="Elige tus agentes de IA local. Licencia mensual, 7 días de prueba, cancela cuando quieras.">
<meta property="og:url" content="https://tuialista.com/catalogo/">
<meta property="og:type" content="website">
<meta property="og:image" content="https://tuialista.com/assets/img/icon-512.png">
<meta property="og:site_name" content="Tuialista">
<meta property="og:locale" content="es_MX">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Catálogo de agentes — TuIAlista">
<meta name="twitter:description" content="Elige tus agentes de IA local. Licencia mensual, 7 días de prueba, cancela cuando quieras.">
<script defer data-domain="tuialista.com" src="https://plausible.io/js/script.js"></script>
</head>
<body>
<header><div class="nav">
  <a class="logo" href="/"><span class="dot"></span>Tu<b>IA</b>lista</a>
  <div class="r">
    <a class="hide-sm" href="/soporte/" id="l-support">Soporte</a>
    <a href="/portal/" id="l-portal">Entrar</a>
  </div>
</div></header>

<main>
  <div class="head">
    <div class="eyebrow" id="eyebrow">EL CATÁLOGO</div>
    <h1 id="title">Elige tus agentes</h1>
    <p class="sub" id="sub">Licencia mensual, cada agente corre localmente en tu equipo. 7 días de prueba y cancelas cuando quieras.</p>
    <div class="trust">
      <span id="t1"><i class="ti ti-lock"></i> Datos 100% locales</span>
      <span id="t2"><i class="ti ti-calendar"></i> 7 días de prueba</span>
      <span id="t3"><i class="ti ti-ban"></i> Cancela cuando quieras</span>
    </div>
  </div>
  <div class="grid" id="grid">
    <div class="state" id="loading">Cargando catálogo…</div>
  </div>
</main>

<footer>&copy; <span id="y"></span> TuIAlista &middot; <a href="/soporte/">Soporte</a> &middot; <a href="/">Inicio</a></footer>

<script src="/checkout.js"></script>
<script>
(function(){
  var API=(window.CHECKOUT_API_BASE||"https://tuialista-xrtd.onrender.com").replace(/\/$/,"");
  var LANG=(function(){try{var l=(localStorage.getItem("tuialista_lang")||"es").slice(0,2).toLowerCase();return ["es","en","pt","fr","de","it"].indexOf(l)>=0?l:"es";}catch(e){return "es";}})();
  var EN=LANG==="en";
  function L(o){return o[LANG]||o.es;}
  document.getElementById("y").textContent=new Date().getFullYear();
  var ICON={documents:"file-text",excel:"table",database:"database",fiscal:"report-money",
    contratos:"file-certificate","docs-tecnica":"file-code",tramites:"building-bank",
    "contratos-personales":"signature",garantias:"shield-check",facturas:"file-invoice",
    conocimiento:"books",nominas:"id-badge-2",inventario:"box-seam",actas:"clipboard-text",
    correo:"inbox",as400:"server-2"};
  if(LANG!=="es"){
    document.documentElement.lang=LANG;
    document.getElementById("eyebrow").textContent=L({es:"EL CATÁLOGO",en:"THE CATALOG",pt:"O CATÁLOGO",fr:"LE CATALOGUE",de:"DER KATALOG",it:"IL CATALOGO"});
    document.getElementById("title").textContent=L({es:"Elige tus agentes",en:"Choose your agents",pt:"Escolha seus agentes",fr:"Choisissez vos agents",de:"Wähle deine Agenten",it:"Scegli i tuoi agenti"});
    document.getElementById("sub").textContent=L({es:"Licencia mensual, cada agente corre localmente en tu equipo. 7 días de prueba y cancelas cuando quieras.",en:"Monthly license, each agent runs locally on your machine. 7-day trial, cancel anytime.",pt:"Licença mensal, cada agente roda localmente na sua máquina. 7 dias de teste, cancele quando quiser.",fr:"Licence mensuelle, chaque agent s'exécute localement sur votre machine. Essai de 7 jours, annulez quand vous voulez.",de:"Monatliche Lizenz, jeder Agent läuft lokal auf deinem Gerät. 7 Tage Testphase, jederzeit kündbar.",it:"Licenza mensile, ogni agente gira localmente sul tuo dispositivo. 7 giorni di prova, annulla quando vuoi."});
    document.getElementById("t1").innerHTML='<i class="ti ti-lock"></i> '+L({es:"Datos 100% locales",en:"100% local data",pt:"Dados 100% locais",fr:"Données 100% locales",de:"100% lokale Daten",it:"Dati 100% locali"});
    document.getElementById("t2").innerHTML='<i class="ti ti-calendar"></i> '+L({es:"7 días de prueba",en:"7-day trial",pt:"7 dias de teste",fr:"Essai de 7 jours",de:"7 Tage Testphase",it:"7 giorni di prova"});
    document.getElementById("t3").innerHTML='<i class="ti ti-ban"></i> '+L({es:"Cancela cuando quieras",en:"Cancel anytime",pt:"Cancele quando quiser",fr:"Annulez quand vous voulez",de:"Jederzeit kündbar",it:"Annulla quando vuoi"});
    document.getElementById("l-support").textContent=L({es:"Soporte",en:"Support",pt:"Suporte",fr:"Support",de:"Support",it:"Supporto"});
    document.getElementById("l-portal").textContent=L({es:"Entrar",en:"Sign in",pt:"Entrar",fr:"Se connecter",de:"Anmelden",it:"Accedi"});
  }
  var BUY=L({es:"Suscribirme",en:"Subscribe",pt:"Assinar",fr:"S'abonner",de:"Abonnieren",it:"Abbonati"}), MO=L({es:" / mes",en:" / mo",pt:" / mês",fr:" / mois",de:" / Mon.",it:" / mese"});
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
  var byId={};
  function render(list){
    var grid=document.getElementById("grid");
    if(!list||!list.length){grid.innerHTML='<div class="state">'+L({es:"El catálogo no está disponible ahora.",en:"Catalog unavailable right now.",pt:"O catálogo não está disponível agora.",fr:"Le catalogue n'est pas disponible pour le moment.",de:"Der Katalog ist gerade nicht verfügbar.",it:"Il catalogo non è disponibile al momento."})+'</div>';return;}
    grid.innerHTML=list.map(function(a){
      byId[a.id]={name:a.name,price:a.price_usd};
      var icon=ICON[a.id]||"robot";
      return '<div class="card">'+
        '<div class="ico"><i class="ti ti-'+icon+'"></i></div>'+
        '<h3>'+esc(a.name)+'</h3>'+
        '<p>'+esc(a.description||"")+'</p>'+
        '<div class="price">$'+Number(a.price_usd).toFixed(0)+'<small>'+MO+'</small></div>'+
        '<button class="buy" data-agent="'+esc(a.id)+'"><i class="ti ti-arrow-right"></i> '+BUY+'</button>'+
        '</div>';
    }).join("");
    [].forEach.call(grid.querySelectorAll(".buy"),function(b){
      b.addEventListener("click",function(){
        var id=b.getAttribute("data-agent"), a=byId[id]||{};
        if(window.TuiaCheckout)TuiaCheckout.open(id,a.name,a.price);
      });
    });
    // Deep-link ?agent=<id> -> abre el modal directo
    try{
      var want=new URLSearchParams(location.search).get("agent");
      if(want&&byId[want]&&window.TuiaCheckout)TuiaCheckout.open(want,byId[want].name,byId[want].price);
    }catch(e){}
  }
  fetch(API+"/api/catalog").then(function(r){return r.json();})
    .then(function(d){render(d.agents||[]);})
    .catch(function(){document.getElementById("grid").innerHTML='<div class="state">'+L({es:"No se pudo cargar el catálogo. Inténtalo de nuevo.",en:"Couldn't load the catalog. Please try again.",pt:"Não foi possível carregar o catálogo. Tente novamente.",fr:"Impossible de charger le catalogue. Réessayez.",de:"Katalog konnte nicht geladen werden. Versuche es erneut.",it:"Impossibile caricare il catalogo. Riprova."})+'</div>';});
})();
</script>
</body>
</html>
